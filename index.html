<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbital Drift Lab</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Tiny physics playground</p>
        <h1>Orbital Drift Lab</h1>
        <p>Launch glowing particles and watch gravity pull them into motion.</p>
      </section>
      <nav class="controls" aria-label="Simulation controls">
        <button id="add" type="button">Add body</button>
        <button id="reset" type="button">Reset</button>
      </nav>
      <canvas id="world" width="960" height="540" aria-label="Physics simulation canvas"></canvas>
    </main>
    <script src="app.js"></script>
  </body>
</html>
